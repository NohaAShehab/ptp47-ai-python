<svg xmlns="http://www.w3.org/2000/svg" width="920" height="286" viewBox="0 0 920 286" role="img">
  <title>Concatenation creates l3. extend mutates l1 and leaves l2 alone.</title>
  <rect width="920" height="286" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#A85F00" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">+ builds a new list. extend changes the first list.</text><text x="32.0" y="58.0" fill="#2468B8" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">+</text><rect x="70.0" y="78.0" width="160.0" height="44.0" rx="14" fill="#2468B8" stroke="#0F1724" stroke-width="2.2"/><text x="150.0" y="100.0" fill="white" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list 1</text><text x="260.0" y="100.0" fill="#0F1724" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">+</text><rect x="290.0" y="78.0" width="160.0" height="44.0" rx="14" fill="#C9491A" stroke="#0F1724" stroke-width="2.2"/><text x="370.0" y="100.0" fill="white" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list 2</text><text x="480.0" y="100.0" fill="#0F1724" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">=</text><rect x="510.0" y="70.0" width="340.0" height="58.0" rx="14" fill="#17885B" stroke="#0F1724" stroke-width="2.2"/><text x="680.0" y="99.0" fill="white" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list 3, a new list</text><text x="32.0" y="160.0" fill="#6B4C9A" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">extend</text><rect x="120.0" y="180.0" width="430.0" height="50.0" rx="14" fill="#6B4C9A" stroke="#0F1724" stroke-width="2.2"/><text x="335.0" y="205.0" fill="white" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list 1 grows, list 2 stays</text><rect x="580.0" y="180.0" width="250.0" height="50.0" rx="14" fill="#C9491A" stroke="#0F1724" stroke-width="2.2"/><text x="705.0" y="205.0" fill="white" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list 2 unchanged</text><text x="460.0" y="260.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">The next cell prints list 2, so you still see the short list</text>
</svg>
