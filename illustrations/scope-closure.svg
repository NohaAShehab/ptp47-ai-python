<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>scaler reads mean and std from the function that built it</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="80" y="40" width="760" height="200" rx="16" fill="#E3EEFB" stroke="#2468B8" stroke-width="2.4"/><text x="460" y="72" fill="#2468B8" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">make_scaler(44, 5)</text><text x="250" y="120" fill="#0F1724" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">mean = 44</text><text x="250" y="150" fill="#0F1724" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">std = 5</text><rect x="420" y="100" width="360" height="110" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="600" y="136" fill="#17885B" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">scaler(x=10)</text><text x="600" y="170" fill="#333333" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">(10 - 44) / 5 = -6.8</text>
</svg>
