<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>Clean numbers return. One bad line stops the list.</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="40" y="60" width="400" height="180" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="240" y="98" fill="#17885B" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Clean lines</text><text x="240" y="140" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">&quot;33&quot;  &quot;324&quot;  &quot;324&quot;</text><text x="240" y="178" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">each int() returns a number</text><text x="240" y="206" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">the list is finished</text><rect x="480" y="60" width="400" height="180" rx="16" fill="#FCE8E0" stroke="#C9491A" stroke-width="2.4"/><text x="680" y="98" fill="#C9491A" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">One bad item</text><text x="680" y="140" fill="#B83232" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">&quot;iti&quot; stops the climb</text><text x="680" y="178" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">later lines never run</text><text x="680" y="206" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">the list is never built</text>
</svg>
