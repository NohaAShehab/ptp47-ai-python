<svg xmlns="http://www.w3.org/2000/svg" width="920" height="276" viewBox="0 0 920 276" role="img">
  <title>Calling sort returns None while the list ll is rearranged in place</title>
  <rect width="920" height="276" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">sort() changes the list and returns None</text><rect x="60.0" y="80.0" width="220.0" height="64.0" rx="14" fill="#2468B8" stroke="#0F1724" stroke-width="2.2"/><text x="170.0" y="112.0" fill="white" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">2, 455, 33</text><text x="320.0" y="112.0" fill="#6B4C9A" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">.sort()</text><line x1="400.0" y1="112.0" x2="488.0" y2="112.0" stroke="#6B4C9A" stroke-width="2.6" stroke-linecap="round"/><polygon points="500.0,112.0 488.0,118.5 488.0,105.5" fill="#6B4C9A"/><rect x="510.0" y="80.0" width="150.0" height="64.0" rx="14" fill="#E1E6EE" stroke="#0F1724" stroke-width="2.2"/><text x="585.0" y="112.0" fill="#0F1724" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">None</text><rect x="60.0" y="180.0" width="280.0" height="56.0" rx="14" fill="#17885B" stroke="#0F1724" stroke-width="2.2"/><text x="200.0" y="208.0" fill="white" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">list is now 2, 33, 455</text><text x="460.0" y="250.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">The name x holds None. The order lives in the list itself.</text>
</svg>
