<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="This notebook runs Python 3.14 with the GIL on. The free-threaded build is python3.14t.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">23</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">TWO BUILDS</text><g><rect x="120" y="72" width="360" height="190" rx="20" fill="#FFFFFF" stroke="#E4B04A" stroke-width="3"/><rect x="120" y="72" width="360" height="48" rx="20" fill="#24384A"/><rect x="120" y="100" width="360" height="20" fill="#24384A"/><text x="300" y="98" fill="#FFFFFF" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">this kernel</text><text x="144" y="150" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">version</text><text x="456" y="150" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">3.14</text><text x="144" y="182" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">free-threaded</text><text x="456" y="182" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">False</text><text x="144" y="214" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">GIL enabled</text><text x="456" y="214" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">True</text></g><g><rect x="540" y="72" width="360" height="190" rx="20" fill="#FFFFFF"/><rect x="540" y="72" width="360" height="48" rx="20" fill="#1F9A88"/><rect x="540" y="100" width="360" height="20" fill="#1F9A88"/><text x="720" y="98" fill="#FFFFFF" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">python3.14t</text><text x="564" y="150" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">version</text><text x="876" y="150" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">3.14t</text><text x="564" y="182" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">free-threaded</text><text x="876" y="182" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">True</text><text x="564" y="214" fill="#8C7564" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">GIL enabled</text><text x="876" y="214" fill="#1E2A36" font-size="14" font-weight="600" font-style="normal" text-anchor="end" font-family="Inter, DejaVu Sans, sans-serif">can be off</text></g>
