<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img">
  <title>break skips the for-else. Finishing the loop runs it and locks the account.</title>
  <rect width="920" height="300" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#17885B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">else on a for runs only when break did not</text><rect x="36.0" y="56.0" width="400.0" height="190.0" rx="14" fill="#DFF3EA" stroke="#0F1724" stroke-width="2.2"/><text x="236.0" y="86.0" fill="#17885B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">password is 1234</text><text x="236.0" y="122.0" fill="#0F1724" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">break</text><text x="236.0" y="160.0" fill="#17885B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">the for-else is skipped</text><text x="236.0" y="200.0" fill="#5C6570" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Done</text><rect x="480.0" y="56.0" width="400.0" height="190.0" rx="14" fill="#F3EEF8" stroke="#0F1724" stroke-width="2.2"/><text x="680.0" y="86.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">no correct password</text><text x="680.0" y="122.0" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">loop reaches the end</text><text x="680.0" y="160.0" fill="#B83232" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">else: Account is locked</text><text x="680.0" y="200.0" fill="#5C6570" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Done</text><text x="460.0" y="272.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">This else belongs to the for, not to the if</text>
</svg>
