<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>Calling the inner function returns a number. Returning it hands back the function.</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="40" y="60" width="400" height="170" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="240" y="108" fill="#17885B" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">scaler(10)</text><text x="240" y="150" fill="#333333" font-size="16" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">runs now</text><text x="240" y="182" fill="#0F1724" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">you get -6.8</text><rect x="480" y="60" width="400" height="170" rx="16" fill="#E3EEFB" stroke="#2468B8" stroke-width="2.4"/><text x="680" y="108" fill="#2468B8" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">return scaler</text><text x="680" y="150" fill="#333333" font-size="16" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">hands back the tool</text><text x="680" y="182" fill="#0F1724" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">call it later</text>
</svg>
