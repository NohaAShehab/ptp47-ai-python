<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="virus.exe fails first at 0.2 seconds, then b, c, and a finish.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">19</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">IN FINISHING ORDER</text><g>
          <rect x="116" y="100" width="168" height="120" rx="18" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
          <rect x="116" y="100" width="168" height="36" rx="18" fill="#E36A55"/>
          <rect x="116" y="118" width="168" height="18" fill="#E36A55"/>
          <text x="200" y="118" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">0.2s</text>
          <text x="200" y="162" fill="#1E2A36" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">virus.exe</text>
          <text x="200" y="190" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">failed</text>
        </g><line x1="290" y1="160" x2="312" y2="160" stroke="#8C7564" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><g>
          <rect x="318" y="100" width="168" height="120" rx="18" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
          <rect x="318" y="100" width="168" height="36" rx="18" fill="#1F9A88"/>
          <rect x="318" y="118" width="168" height="18" fill="#1F9A88"/>
          <text x="402" y="118" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">0.6s</text>
          <text x="402" y="162" fill="#1E2A36" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">b.csv</text>
          <text x="402" y="190" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">600 KB</text>
        </g><line x1="492" y1="160" x2="514" y2="160" stroke="#8C7564" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><g>
          <rect x="520" y="100" width="168" height="120" rx="18" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
          <rect x="520" y="100" width="168" height="36" rx="18" fill="#E4B04A"/>
          <rect x="520" y="118" width="168" height="18" fill="#E4B04A"/>
          <text x="604" y="118" fill="#24384A" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">0.8s</text>
          <text x="604" y="162" fill="#1E2A36" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">c.csv</text>
          <text x="604" y="190" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">800 KB</text>
        </g><line x1="694" y1="160" x2="716" y2="160" stroke="#8C7564" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><g>
          <rect x="722" y="100" width="168" height="120" rx="18" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
          <rect x="722" y="100" width="168" height="36" rx="18" fill="#24384A"/>
          <rect x="722" y="118" width="168" height="18" fill="#24384A"/>
          <text x="806" y="118" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">1.0s</text>
          <text x="806" y="162" fill="#1E2A36" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">a.csv</text>
          <text x="806" y="190" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">1000 KB</text>
        </g>
  </g>
  <rect x="1.25" y="1.25" width="957.5" height="297.5" rx="27" fill="none" stroke="#E6D5C3" stroke-width="1.5"/>
</svg>
