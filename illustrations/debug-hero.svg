<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>A magnifying glass over a traceback</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="70" y="56" width="500" height="170" rx="16" fill="#0F1724" stroke="#0F1724" stroke-width="2.4"/><text x="320" y="100" fill="#FFD43B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">Traceback</text><text x="320" y="136" fill="#B7C3D6" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">File, line, then the call</text><text x="320" y="168" fill="#F6F4EE" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">last line: the error name</text><rect x="620" y="70" width="230" height="140" rx="16" fill="#FDECEC" stroke="#B83232" stroke-width="2.4"/><text x="735" y="118" fill="#B83232" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">read last</text><text x="735" y="158" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">then find your line</text>
</svg>
