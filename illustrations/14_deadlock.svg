<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Each transfer holds the lock the other wants. The cell reports deadlock: True.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">14</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">OPPOSITE ORDER</text><g>
      <rect x="128" y="100" width="90" height="40" rx="20.0" fill="#E36A55"/>
      <text x="173.0" y="120.0" fill="#FFFFFF" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">A → B</text>
    </g><text x="240" y="120" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">holds</text><g>
      <rect x="300" y="100" width="70" height="40" rx="20.0" fill="#E36A55"/>
      <text x="335.0" y="120.0" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">A</text>
    </g><line x1="384" y1="120" x2="430" y2="120" stroke="#8C7564" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="448" y="120" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">wants</text><g>
      <rect x="510" y="100" width="70" height="40" rx="20.0" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
      <text x="545.0" y="120.0" fill="#E36A55" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">B</text>
    </g><g>
      <rect x="128" y="168" width="90" height="40" rx="20.0" fill="#1F9A88"/>
      <text x="173.0" y="188.0" fill="#FFFFFF" font-size="15" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">B → A</text>
    </g><text x="240" y="188" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">holds</text><g>
      <rect x="300" y="168" width="70" height="40" rx="20.0" fill="#1F9A88"/>
      <text x="335.0" y="188.0" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">B</text>
    </g><line x1="384" y1="188" x2="430" y2="188" stroke="#8C7564" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="448" y="188" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">wants</text><g>
      <rect x="510" y="168" width="70" height="40" rx="20.0" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
      <text x="545.0" y="188.0" fill="#1F9A88" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">A</text>
    </g><g>
      <rect x="680" y="96" width="220" height="120" rx="26" fill="#24384A"/>
      <text x="790.0" y="148.0" fill="#FFFBF6" font-size="40" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">True</text>
      <text x="790.0" y="190" fill="#E4B04A" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.5">DEADLOCK</text>
    </g><text x="128" y="250" fill="#8C7564" font-size="15" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">same order on both sides lets both transfers finish</text>
  </g>
  <rect x="1.25" y="1.25" width="957.5" height="297.5" rx="27" fill="none" stroke="#E6D5C3" stroke-width="1.5"/>
</svg>
