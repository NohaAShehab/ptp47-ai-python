<svg xmlns="http://www.w3.org/2000/svg" width="920" height="258" viewBox="0 0 920 258" role="img">
  <title>The string Ali becomes the list A, l, i</title>
  <rect width="920" height="258" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#A85F00" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">list("Ali") walks the characters</text><rect x="70.0" y="78.0" width="180.0" height="90.0" rx="20" fill="#A85F00" stroke="#0F1724" stroke-width="2.2"/><text x="160.0" y="123.0" fill="white" font-size="32" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Ali</text><line x1="280.0" y1="123.0" x2="378.0" y2="123.0" stroke="#A85F00" stroke-width="2.6" stroke-linecap="round"/><polygon points="390.0,123.0 378.0,129.5 378.0,116.5" fill="#A85F00"/><rect x="400.0" y="72.0" width="100.0" height="96.0" rx="14" fill="#2468B8" stroke="#0F1724" stroke-width="2.2"/><text x="450.0" y="120.0" fill="white" font-size="36" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">A</text><text x="450.0" y="186.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">0</text><rect x="520.0" y="72.0" width="100.0" height="96.0" rx="14" fill="#C9491A" stroke="#0F1724" stroke-width="2.2"/><text x="570.0" y="108.0" fill="white" font-size="36" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">l</text><text x="570.0" y="142.0" fill="#FFE08A" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">ell</text><text x="570.0" y="186.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">1</text><rect x="640.0" y="72.0" width="100.0" height="96.0" rx="14" fill="#17885B" stroke="#0F1724" stroke-width="2.2"/><text x="690.0" y="120.0" fill="white" font-size="36" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">i</text><text x="690.0" y="186.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">2</text><text x="460.0" y="214.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">A string is a sequence, so list() gives one string per character.</text><text x="460.0" y="236.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">The middle letter is ell.</text>
</svg>
