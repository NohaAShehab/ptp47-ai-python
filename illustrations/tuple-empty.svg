<svg xmlns="http://www.w3.org/2000/svg" width="920" height="210" viewBox="0 0 920 210" role="img">
  <title>Empty parentheses and tuple of an empty list are both empty tuples</title>
  <rect width="920" height="210" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#2468B8" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">Two ways to write an empty tuple</text><rect x="140.0" y="70.0" width="240.0" height="110.0" rx="16" fill="#E3EEFB" stroke="#0F1724" stroke-width="2.2"/><text x="260.0" y="112.0" fill="#2468B8" font-size="36" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">()</text><text x="260.0" y="150.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">len 0</text><rect x="500.0" y="70.0" width="280.0" height="110.0" rx="16" fill="#E1E6EE" stroke="#0F1724" stroke-width="2.2"/><text x="640.0" y="112.0" fill="#1F3A68" font-size="28" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">tuple([])</text><text x="640.0" y="150.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">also len 0</text>
</svg>
