<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>A text file and a JSON file side by side</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<path d="M70 88 h36 l10 12 h120 v78 h-166 z" fill="#E3EEFB" stroke="#2468B8" stroke-width="2.4"/><path d="M70 88 h36 l10 12 h40" fill="none" stroke="#2468B8" stroke-width="2.4"/><text x="153" y="118" fill="#2468B8" font-size="15" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">story.txt</text><text x="153" y="142" fill="#5C6570" font-size="12" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">a line of text</text><text x="153" y="158" fill="#5C6570" font-size="12" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">then another line</text><line x1="280" y1="150" x2="348" y2="150" stroke="#1F3A68" stroke-width="3.2" stroke-linecap="round"/><polygon points="360,150 346,142 346,158" fill="#1F3A68"/><rect x="380" y="78" width="220" height="140" rx="16" fill="#FFF6D6" stroke="#A85F00" stroke-width="2.4"/><text x="490" y="118" fill="#A85F00" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">students.json</text><text x="490" y="152" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">{ &quot;name&quot;: &quot;Menna&quot; }</text><text x="490" y="178" fill="#5C6570" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">a dictionary, saved</text><rect x="640" y="78" width="220" height="140" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="750" y="124" fill="#17885B" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">read it back</text><text x="750" y="160" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">same shape, real data</text>
