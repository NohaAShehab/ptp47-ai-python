<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="A plain thread prints ValueError and moves on. The future holds it for main to catch.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">20</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">WHO KEEPS THE EXCEPTION?</text><g>
      <rect x="120" y="64" width="390" height="212" rx="22" fill="#F8E6E0"/>
      <text x="142" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">plain Thread</text>
    </g><rect x="160" y="130" width="220" height="90" rx="14" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/><text x="270" y="166" fill="#E36A55" font-size="18" font-weight="500" font-style="italic" text-anchor="middle" font-family="EB Garamond, DejaVu Serif, serif">ValueError</text><text x="270" y="194" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">printed, then gone</text><g>
      <rect x="530" y="64" width="400" height="212" rx="22" fill="#E3F3EF"/>
      <text x="552" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">future</text>
    </g><rect x="600" y="124" width="250" height="110" rx="16" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/><text x="725" y="160" fill="#1F9A88" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.2">Future</text><text x="725" y="196" fill="#24384A" font-size="22" font-weight="500" font-style="italic" text-anchor="middle" font-family="EB Garamond, DejaVu Serif, serif">ValueError</text><text x="600" y="258" fill="#1F9A88" font-size="14" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">main caught: bad data</text>
  </g>
  <rect x="1.25" y="1.25" width="957.5" height="297.5" rx="27" fill="none" stroke="#E6D5C3" stroke-width="1.5"/>
</svg>
