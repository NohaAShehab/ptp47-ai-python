<text x="40.0" y="242.0" fill="#6B4C9A" font-size="14" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">format(lang="python", country="Egypt")</text>
<text x="40.0" y="278.0" fill="#0F1724" font-size="16" font-weight="600" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">We love </text>
