<text x="620.0" y="140.0" fill="#5C6570" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">{0} is the first value you pass</text>
