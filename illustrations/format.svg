<text x="425.1" y="74.0" fill="white" font-size="15" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="middle" dominant-baseline="central">{}</text>
<text x="620.0" y="38.0" fill="#5C6570" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">first value, then second value</text>
<rect x="20" y="118" width="880" height="90" rx="14" fill="#FCE8E0"/>
<text x="40.0" y="140.0" fill="#C9491A" font-size="14" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">.format("Egypt", "python")</text>
<text x="40.0" y="176.0" fill="#0F1724" font-size="16" font-weight="600" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">We love </text>
<rect x="119.4" y="162.0" width="53.6" height="28" rx="7" fill="#C9491A"/>
<text x="146.2" y="176.0" fill="white" font-size="15" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="middle" dominant-baseline="central">{0}</text>
<text x="187.0" y="176.0" fill="#0F1724" font-size="16" font-weight="600" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">very much. we lives in </text>
