<text x="140.6" y="74.0" fill="white" font-size="15" font-weight="700" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="middle" dominant-baseline="central">{}</text>
<text x="175.8" y="74.0" fill="#0F1724" font-size="16" font-weight="600" font-family="DejaVu Sans Mono, Liberation Mono, Consolas, monospace" text-anchor="start" dominant-baseline="central">very much. we lives in </text>
