<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>A dictionary blocked from a text file, then saved as text that is still not a dictionary</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="40" y="70" width="250" height="150" rx="16" fill="#FCE8E0" stroke="#C9491A" stroke-width="2.4"/><text x="165" y="112" fill="#C9491A" font-size="20" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">info dict</text><text x="165" y="148" fill="#333333" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">write() wants str</text><circle cx="330" cy="145" r="16" fill="#FDECEC" stroke="#B83232" stroke-width="2.4"/><line x1="322" y1="137" x2="338" y2="153" stroke="#B83232" stroke-width="3" stroke-linecap="round"/><line x1="338" y1="137" x2="322" y2="153" stroke="#B83232" stroke-width="3" stroke-linecap="round"/><rect x="370" y="70" width="230" height="150" rx="16" fill="#F4F1E8" stroke="#1F3A68" stroke-width="2.4"/><text x="485" y="112" fill="#1F3A68" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">students.txt</text><text x="485" y="150" fill="#333333" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">str(info) is text</text><text x="485" y="176" fill="#B83232" font-size="13" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">not a dict on the way back</text><rect x="640" y="70" width="240" height="150" rx="16" fill="#FDECEC" stroke="#B83232" stroke-width="2.4"/><text x="760" y="120" fill="#B83232" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">TypeError</text><text x="760" y="160" fill="#333333" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">dict is not str</text>
</svg>
