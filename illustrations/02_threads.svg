      <text x="146" y="230.0" fill="#24384A" font-size="15" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">c.csv     0.8s</text>
    </g><g>
      <rect x="742" y="108" width="180" height="120" rx="26" fill="#24384A"/>
      <text x="832.0" y="160.0" fill="#FFFBF6" font-size="42" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">1.0s</text>
      <text x="832.0" y="202" fill="#E4B04A" font-size="12" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.5">SLOWEST</text>
