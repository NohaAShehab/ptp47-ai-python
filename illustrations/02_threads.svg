<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Three downloads start together. The clock keeps the slowest wait, 1.0 second.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">02</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <circle cx="180" cy="250" r="140" fill="#E3F3EF" opacity="0.95"/><text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">THREE COURIERS LEAVE TOGETHER</text><g>
      <rect x="128" y="78" width="520" height="48" rx="24" fill="#EFE4D6"/>
      <rect x="128" y="78" width="520" height="48" rx="24" fill="#E36A55"/>
      <text x="146" y="102.0" fill="#FFFBF6" font-size="15" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">a.csv     1.0s</text>
    </g><g>
      <rect x="128" y="142" width="520" height="48" rx="24" fill="#EFE4D6"/>
      <rect x="128" y="142" width="312" height="48" rx="24" fill="#1F9A88"/>
      <text x="146" y="166.0" fill="#FFFBF6" font-size="15" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">b.csv     0.6s</text>
    </g><g>
      <rect x="128" y="206" width="520" height="48" rx="24" fill="#EFE4D6"/>
