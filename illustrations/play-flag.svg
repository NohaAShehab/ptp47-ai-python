<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img">
  <title>Success sets login True and breaks. Three failures leave i at 2 and login False, so the account locks.</title>
  <rect width="920" height="260" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#2468B8" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">A flag remembers whether login succeeded</text><rect x="36.0" y="56.0" width="400.0" height="180.0" rx="14" fill="#E3EEFB" stroke="#0F1724" stroke-width="2.2"/><text x="236.0" y="84.0" fill="#2468B8" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">password is 1234</text><text x="236.0" y="116.0" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">login = True</text><text x="236.0" y="148.0" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">break</text><text x="236.0" y="186.0" fill="#17885B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">lock test is false</text><text x="236.0" y="212.0" fill="#5C6570" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Done</text><rect x="480.0" y="56.0" width="400.0" height="180.0" rx="14" fill="#FCE8E0" stroke="#0F1724" stroke-width="2.2"/><text x="680.0" y="84.0" fill="#C9491A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">three wrong passwords</text><text x="680.0" y="116.0" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">login stays False</text><text x="680.0" y="148.0" fill="#0F1724" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">i ends at 2</text><text x="680.0" y="186.0" fill="#B83232" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Account is locked</text><text x="680.0" y="212.0" fill="#5C6570" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">Done</text>
</svg>
