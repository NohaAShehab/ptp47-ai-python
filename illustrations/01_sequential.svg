<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="One courier carries a.csv, then b.csv, then c.csv. The waits add to 2.4 seconds.">
