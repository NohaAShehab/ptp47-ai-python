ly="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">changed here</text><rect x="580.0" y="170.0" width="220.0" height="64.0" rx="14" fill="#17885B" stroke="#0F1724" stroke-width="2.2"/><text x="690.0" y="194.0" fill="white" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">10 , 0</text><text x="690.0" y="216.0" fill="#F6F4EE" font-size="13" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">still the old 0</text><text x="460.0" y="268.0" fill="#5C6570" font-size="16" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">grid[0][1] = 50 does not touch the copy</text>
