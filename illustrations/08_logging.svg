<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="print lines overlap. logging writes one whole line per thread, with the thread name.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">08</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">WHOLE LINES, WITH A NAME</text><g>
      <rect x="120" y="64" width="360" height="212" rx="22" fill="#F8E6E0"/>
      <text x="142" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">print</text>
    </g><text x="300" y="118" fill="#E36A55" font-size="16" font-family="Inter, DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle" transform="rotate(-7 300 118)" opacity="0.9">hello from thread 4</text><text x="300" y="148" fill="#E36A55" font-size="16" font-family="Inter, DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle" transform="rotate(4 300 148)" opacity="0.9">hello from thread 1</text><text x="300" y="176" fill="#E36A55" font-size="16" font-family="Inter, DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle" transform="rotate(-3 300 176)" opacity="0.9">hello from thread 7</text><text x="300" y="206" fill="#E36A55" font-size="16" font-family="Inter, DejaVu Sans, sans-serif" font-weight="600" text-anchor="middle" transform="rotate(6 300 206)" opacity="0.9">hello thread 2 hello</text><g>
      <rect x="500" y="64" width="436" height="212" rx="22" fill="#E3F3EF"/>
      <text x="522" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">logging</text>
    </g><g>
      <rect x="560" y="118" width="124" height="30" rx="15.0" fill="#1F9A88"/>
      <text x="622.0" y="133.0" fill="#FFFFFF" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">worker-0</text>
    </g><text x="698" y="133" fill="#1E2A36" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">hello from thread</text><g>
      <rect x="560" y="154" width="124" height="30" rx="15.0" fill="#E36A55"/>
      <text x="622.0" y="169.0" fill="#FFFFFF" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">worker-1</text>
    </g><text x="698" y="169" fill="#1E2A36" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">hello from thread</text><g>
      <rect x="560" y="190" width="124" height="30" rx="15.0" fill="#E4B04A"/>
      <text x="622.0" y="205.0" fill="#24384A" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">worker-2</text>
    </g><text x="698" y="205" fill="#1E2A36" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">hello from thread</text><g>
      <rect x="560" y="226" width="124" height="30" rx="15.0" fill="#24384A"/>
      <text x="622.0" y="241.0" fill="#FFFFFF" font-size="13" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">worker-3</text>
    </g><text x="698" y="241" fill="#1E2A36" font-size="14" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">hello from thread</text>
  </g>
  <rect x="1.25" y="1.25" width="957.5" height="297.5" rx="27" fill="none" stroke="#E6D5C3" stroke-width="1.5"/>
</svg>
