<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="With the GIL, two counting threads took 0.9 seconds after a 0.5 second sequential run.">
  <defs>
