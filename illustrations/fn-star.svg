<svg xmlns="http://www.w3.org/2000/svg" width="920" height="286" viewBox="0 0 920 286" role="img">
  <title>Star collects extra positions into a tuple. Double star collects named extras into a dict.</title>
  <rect width="920" height="286" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">* packs a tuple. ** packs a dictionary.</text><text x="230.0" y="58.0" fill="#2468B8" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">*grades</text><rect x="50.0" y="74.0" width="80.0" height="44.0" rx="14" fill="#2468B8" stroke="#0F1724" stroke-width="2.2"/><text x="90.0" y="96.0" fill="white" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">33</text><rect x="140.0" y="74.0" width="80.0" height="44.0" rx="14" fill="#C9491A" stroke="#0F1724" stroke-width="2.2"/><text x="180.0" y="96.0" fill="white" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">324</text><line x1="230.0" y1="96.0" x2="288.0" y2="96.0" stroke="#2468B8" stroke-width="2.6" stroke-linecap="round"/><polygon points="300.0,96.0 288.0,102.5 288.0,89.5" fill="#2468B8"/><rect x="310.0" y="64.0" width="200.0" height="64.0" rx="14" fill="#E3EEFB" stroke="#0F1724" stroke-width="2.2"/><text x="410.0" y="96.0" fill="#2468B8" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">(33, 324)</text><text x="230.0" y="160.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">**info</text><rect x="40.0" y="176.0" width="110.0" height="40.0" rx="14" fill="#6B4C9A" stroke="#0F1724" stroke-width="2.2"/><text x="95.0" y="196.0" fill="white" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">name</text><rect x="160.0" y="176.0" width="100.0" height="40.0" rx="14" fill="#A85F00" stroke="#0F1724" stroke-width="2.2"/><text x="210.0" y="196.0" fill="white" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">work</text><rect x="270.0" y="176.0" width="110.0" height="40.0" rx="14" fill="#1F3A68" stroke="#0F1724" stroke-width="2.2"/><text x="325.0" y="196.0" fill="white" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">salary</text><line x1="400.0" y1="196.0" x2="458.0" y2="196.0" stroke="#6B4C9A" stroke-width="2.6" stroke-linecap="round"/><polygon points="470.0,196.0 458.0,202.5 458.0,189.5" fill="#6B4C9A"/><rect x="480.0" y="160.0" width="400.0" height="72.0" rx="14" fill="#F3EEF8" stroke="#0F1724" stroke-width="2.2"/><text x="680.0" y="196.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">{name, work, salary}</text><text x="460.0" y="260.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">A call with no keywords prints an empty dictionary</text>
</svg>
