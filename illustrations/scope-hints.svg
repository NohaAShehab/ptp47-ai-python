<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="40" y="70" width="400" height="150" rx="16" fill="#FFF6D6" stroke="#A85F00" stroke-width="2.4"/><text x="240" y="118" fill="#A85F00" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">num: int</text><text x="240" y="158" fill="#333333" font-size="16" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">&quot;iti&quot; still gets in</text><rect x="480" y="70" width="400" height="150" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="680" y="118" fill="#17885B" font-size="22" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">isinstance</text><text x="680" y="158" fill="#333333" font-size="16" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">a check that really runs</text>
