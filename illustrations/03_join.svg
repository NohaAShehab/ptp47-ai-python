<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Without join, main speaks while the worker sleeps. With join, main speaks after the worker finishes.">
  <defs>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1E2A36" flood-opacity="0.14"/>
    </filter>
    <filter id="soft" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#1E2A36" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#8C7564" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="#FBF7F1"/>
    <rect width="88" height="300" fill="#24384A"/>
    <rect x="88" width="4" height="300" fill="#E4B04A"/>
    <circle cx="44" cy="138.0" r="30" fill="none" stroke="#E4B04A" stroke-width="1.25" opacity="0.85"/>
    <text x="44" y="138.0" fill="#FFFBF6" font-size="28" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">03</text>
    <text x="44" y="280" fill="#E4B04A" font-size="11" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.6">DAY 06</text>
    <text x="120" y="44" fill="#8C7564" font-size="12" font-weight="600" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif" letter-spacing="1.7">DOES MAIN WAIT?</text><g>
      <rect x="120" y="64" width="400" height="212" rx="22" fill="#F8E6E0"/>
      <text x="142" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">During the sleep</text>
    </g><g transform="translate(210,246) scale(0.92)">
      <ellipse cx="0" cy="4" rx="18" ry="5" fill="#1E2A36" opacity="0.10"/>
      <rect x="-14" y="-46" width="28" height="44" rx="14" fill="#C9A89A"/>
      <circle cx="0" cy="-64" r="16.5" fill="#F3C7B4" stroke="#1E2A36" stroke-width="1.6"/>
      <path d="M-15,-66 A16.5,16.5 0 0 1 15,-66 Q7,-84 0,-80 Q-7,-84 -15,-66 Z" fill="#24384A"/>
      <circle cx="-5.5" cy="-63" r="1.7" fill="#1E2A36"/>
      <circle cx="5.5" cy="-63" r="1.7" fill="#1E2A36"/>
      <path d="M-5,-55 Q0,-51.5 5,-55" fill="none" stroke="#C47B6A" stroke-width="1.6" stroke-linecap="round"/>
    </g><g>
      <rect x="250" y="130" width="150" height="36" rx="18.0" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
      <text x="325.0" y="148.0" fill="#E36A55" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">still sleeping</text>
    </g><g>
      <rect x="250" y="184" width="176" height="40" rx="20.0" fill="#E36A55"/>
      <text x="338.0" y="204.0" fill="#FFFFFF" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">all done?</text>
    </g><text x="168" y="256" fill="#8C7564" font-size="13" font-weight="500" font-style="normal" text-anchor="start" font-family="Inter, DejaVu Sans, sans-serif">main has already spoken</text><g>
      <rect x="536" y="64" width="400" height="212" rx="22" fill="#E3F3EF"/>
      <text x="558" y="100" fill="#24384A" font-size="22" font-weight="500" font-style="normal" text-anchor="start" font-family="EB Garamond, DejaVu Serif, serif">After the worker</text>
    </g><g transform="translate(626,246) scale(0.92)">
      <ellipse cx="0" cy="4" rx="18" ry="5" fill="#1E2A36" opacity="0.10"/>
      <rect x="-14" y="-46" width="28" height="44" rx="14" fill="#1F9A88"/>
      <circle cx="0" cy="-64" r="16.5" fill="#F3C7B4" stroke="#1E2A36" stroke-width="1.6"/>
      <path d="M-15,-66 A16.5,16.5 0 0 1 15,-66 Q7,-84 0,-80 Q-7,-84 -15,-66 Z" fill="#24384A"/>
      <circle cx="-5.5" cy="-63" r="1.7" fill="#1E2A36"/>
      <circle cx="5.5" cy="-63" r="1.7" fill="#1E2A36"/>
      <path d="M-5,-55 Q0,-51.5 5,-55" fill="none" stroke="#C47B6A" stroke-width="1.6" stroke-linecap="round"/>
    </g><g>
      <rect x="690" y="124" width="160" height="36" rx="18.0" fill="#1F9A88"/>
      <text x="770.0" y="142.0" fill="#FFFFFF" font-size="14" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">finished</text>
    </g><line x1="770" y1="168" x2="770" y2="186" stroke="#1F9A88" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><g>
      <rect x="690" y="190" width="176" height="40" rx="20.0" fill="#24384A"/>
      <text x="778.0" y="210.0" fill="#FFFFFF" font-size="16" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">all done?</text>
    </g>
  </g>
  <rect x="1.25" y="1.25" width="957.5" height="297.5" rx="27" fill="none" stroke="#E6D5C3" stroke-width="1.5"/>
</svg>
