      <text x="512.0" y="151.0" fill="#FFFFFF" font-size="18" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">None</text>
    </g><g>
      <rect x="600" y="78" width="112" height="128" rx="18" fill="#FFFFFF" stroke="#E6D5C3" stroke-width="1.5"/>
