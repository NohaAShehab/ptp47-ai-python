      <text x="656" y="106" fill="#FFFFFF" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif" dominant-baseline="central">0</text>
      <text x="656" y="166" fill="#1E2A36" font-size="34" font-weight="600" font-style="normal" text-anchor="middle" font-family="Inter, DejaVu Sans, sans-serif">9</text>
