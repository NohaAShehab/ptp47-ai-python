<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img">
  <title>One valid pair list, one triple, and a one-item tuple that dict() rejects</title>
  <rect width="920" height="240" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">dict() wants pairs. Each inner sequence must have length 2.</text><rect x="40.0" y="64.0" width="270.0" height="150.0" rx="14" fill="#DFF3EA" stroke="#0F1724" stroke-width="2.2"/><text x="175.0" y="92.0" fill="#17885B" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">works</text><text x="175.0" y="124.0" fill="#0F1724" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">('name', 'Sofyan')</text><text x="175.0" y="150.0" fill="#0F1724" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">('track', 'ai')</text><text x="175.0" y="184.0" fill="#17885B" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">length 2</text><rect x="330.0" y="64.0" width="270.0" height="150.0" rx="14" fill="#FDECEC" stroke="#0F1724" stroke-width="2.2"/><text x="465.0" y="92.0" fill="#B83232" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">length 3</text><text x="465.0" y="128.0" fill="#0F1724" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">('track', 'ai', 47)</text><text x="465.0" y="184.0" fill="#B83232" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">ValueError</text><rect x="620.0" y="64.0" width="260.0" height="150.0" rx="14" fill="#FDECEC" stroke="#0F1724" stroke-width="2.2"/><text x="750.0" y="92.0" fill="#B83232" font-size="14" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">length 1</text><text x="750.0" y="128.0" fill="#0F1724" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">(47,)</text><text x="750.0" y="184.0" fill="#B83232" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">ValueError</text>
</svg>
