<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img">
  <title>tuple of a one-item list is a one-item tuple holding noha</title>
  <rect width="920" height="240" rx="18" fill="#FFFDF8"/>
<text x="32.0" y="28.0" fill="#6B4C9A" font-size="16" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="start" dominant-baseline="central">A one-item list stays one item</text><rect x="80.0" y="70.0" width="280.0" height="100.0" rx="16" fill="#E1E6EE" stroke="#0F1724" stroke-width="2.2"/><text x="220.0" y="108.0" fill="#1F3A68" font-size="26" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">['noha']</text><text x="220.0" y="142.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">one list slot</text><line x1="390.0" y1="120.0" x2="468.0" y2="120.0" stroke="#6B4C9A" stroke-width="2.6" stroke-linecap="round"/><polygon points="480.0,120.0 468.0,126.5 468.0,113.5" fill="#6B4C9A"/><rect x="500.0" y="70.0" width="340.0" height="100.0" rx="16" fill="#F3EEF8" stroke="#0F1724" stroke-width="2.2"/><text x="670.0" y="108.0" fill="#6B4C9A" font-size="26" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">('noha',)</text><text x="670.0" y="142.0" fill="#5C6570" font-size="14" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">one tuple slot</text><text x="460.0" y="210.0" fill="#5C6570" font-size="15" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">tuple(['noha']) does not spell the name. The list had one element.</text>
</svg>
