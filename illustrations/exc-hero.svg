<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img">
<title>An error climbing from int through two functions into a net</title>
<rect width="920" height="280" rx="18" fill="#FFFDF8"/>
<circle cx="28" cy="28" r="8" fill="#E3EEFB"/><circle cx="892" cy="40" r="12" fill="#FCE8E0"/><circle cx="48" cy="252" r="7" fill="#DFF3EA"/>
<rect x="48" y="150" width="180" height="78" rx="16" fill="#FDECEC" stroke="#B83232" stroke-width="2.4"/><text x="138" y="178" fill="#B83232" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">int(&quot;iti&quot;)</text><text x="138" y="206" fill="#333333" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">ValueError is born</text><line x1="240" y1="188" x2="288" y2="188" stroke="#B83232" stroke-width="3.2" stroke-linecap="round"/><polygon points="300,188 286,180 286,196" fill="#B83232"/><rect x="310" y="110" width="190" height="78" rx="16" fill="#FCE8E0" stroke="#C9491A" stroke-width="2.4"/><text x="405" y="140" fill="#C9491A" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">parse_line</text><text x="405" y="166" fill="#333333" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">no try here</text><line x1="512" y1="148" x2="560" y2="148" stroke="#C9491A" stroke-width="3.2" stroke-linecap="round"/><polygon points="572,148 558,140 558,156" fill="#C9491A"/><rect x="582" y="70" width="190" height="78" rx="16" fill="#FFF6D6" stroke="#A85F00" stroke-width="2.4"/><text x="677" y="100" fill="#A85F00" font-size="18" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">load_scores</text><text x="677" y="126" fill="#333333" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">it keeps climbing</text><rect x="300" y="214" width="360" height="42" rx="16" fill="#DFF3EA" stroke="#17885B" stroke-width="2.4"/><text x="480" y="235" fill="#17885B" font-size="15" font-weight="700" font-family="DejaVu Sans, Liberation Sans, Segoe UI, sans-serif" text-anchor="middle" dominant-baseline="central">except is the net that can stop it</text>
</svg>
